name: Deploy to GitHub Pages

on:
  push:
    # `main` is listed so renaming the working branch to main keeps deploying.
    branches: [main, claude/claude-md-docs-uhg2p]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        # Optional analytics: set a repo variable GOATCOUNTER to your
        # https://YOURCODE.goatcounter.com/count endpoint to enable it.
        env:
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
